_type: export
__export_format: 4
__export_date: 2026-08-19T00:00:00.000Z
__export_source: insomnia.desktop.app:v10
resources:
  - _id: wrk_procel_current
    _type: workspace
    name: PROCEL API e Telemetry
    description: Contratos atuais locais. Nao contem credenciais de producao.
  - _id: env_procel_local
    _type: environment
    parentId: wrk_procel_current
    name: Local
    data:
      baseUrl: http://localhost:8080
      telemetryUrl: http://localhost:8081
      jwtToken: ""
      adminEmail: admin@procel.local
      adminPassword: change-me-local
      sensorExternalId: sensor-temp-101
      roomId: room-101
      profileId: ""
      parserVersionId: ""
      bindingId: ""
      telemetryMessageId: insomnia-telemetry-msg-001
      rawTelemetryEventId: ""
      aggregationJobId: ""
      fromIso: 2026-08-19T08:00:00Z
      toIso: 2026-08-19T09:00:00Z
    color: null
    isPrivate: false
    metaSortKey: 1
  - _id: fld_health
    _type: request_group
    parentId: wrk_procel_current
    name: Health
  - _id: req_api_health
    _type: request
    parentId: fld_health
    name: Procel-API health
    method: GET
    url: "{{ _.baseUrl }}/actuator/health"
  - _id: req_telemetry_health
    _type: request
    parentId: fld_health
    name: Procel-Telemetry health
    method: GET
    url: "{{ _.telemetryUrl }}/actuator/health"
  - _id: fld_auth
    _type: request_group
    parentId: wrk_procel_current
    name: Auth
  - _id: req_login
    _type: request
    parentId: fld_auth
    name: Login admin
    method: POST
    url: "{{ _.baseUrl }}/api/auth/login"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |
        {
          "email": "{{ _.adminEmail }}",
          "password": "{{ _.adminPassword }}"
        }
  - _id: fld_canonical
    _type: request_group
    parentId: wrk_procel_current
    name: Ingestao canonica
  - _id: req_canonical_ingest
    _type: request
    parentId: fld_canonical
    name: Criar medicao canonica
    method: POST
    url: "{{ _.baseUrl }}/api/sensors/ingest"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |
        {
          "messageId": "{{ _.telemetryMessageId }}",
          "sensorExternalId": "{{ _.sensorExternalId }}",
          "timestamp": "{{ _.fromIso }}",
          "source": "INSOMNIA",
          "sourceReceivedAt": "{{ _.fromIso }}",
          "values": [
            {
              "parameter": "temperature",
              "numericValue": 24.5
            }
          ]
        }
  - _id: req_sensor_measurements
    _type: request
    parentId: fld_canonical
    name: Medicoes por sensor
    method: GET
    url: "{{ _.baseUrl }}/api/sensors/{{ _.sensorExternalId }}/medicoes"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
  - _id: fld_integrations
    _type: request_group
    parentId: wrk_procel_current
    name: Integracoes
  - _id: req_profiles
    _type: request
    parentId: fld_integrations
    name: Listar perfis
    method: GET
    url: "{{ _.baseUrl }}/api/sensor-integrations/profiles"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
  - _id: req_profile_detail
    _type: request
    parentId: fld_integrations
    name: Detalhar perfil
    method: GET
    url: "{{ _.baseUrl }}/api/sensor-integrations/profiles/{{ _.profileId }}"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
  - _id: req_versions
    _type: request
    parentId: fld_integrations
    name: Listar versoes
    method: GET
    url: "{{ _.baseUrl }}/api/sensor-integrations/profiles/{{ _.profileId }}/versions"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
  - _id: req_bindings
    _type: request
    parentId: fld_integrations
    name: Listar bindings
    method: GET
    url: "{{ _.baseUrl }}/api/sensor-integrations/bindings?profileId={{ _.profileId }}"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
  - _id: req_snapshot
    _type: request
    parentId: fld_integrations
    name: Snapshot
    method: GET
    url: "{{ _.baseUrl }}/api/sensor-integrations/snapshot"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
  - _id: req_profile_ingest_payload
    _type: request
    parentId: fld_integrations
    name: Ingestao externa PAYLOAD_POINTER
    method: POST
    url: "{{ _.baseUrl }}/api/sensors/ingest/integrations/{{ _.profileId }}"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |
        {
          "messageId": "insomnia-profile-message",
          "sensorId": "{{ _.sensorExternalId }}",
          "timestamp": "{{ _.fromIso }}",
          "payload": {
            "temperature": 24.5
          }
        }
  - _id: req_profile_ingest_route
    _type: request
    parentId: fld_integrations
    name: Ingestao externa ROUTE_SENSOR
    method: POST
    url: "{{ _.baseUrl }}/api/sensors/{{ _.sensorExternalId }}/ingest/integrations/{{ _.profileId }}"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |
        {
          "messageId": "insomnia-route-message",
          "timestamp": "{{ _.fromIso }}",
          "payload": {
            "temperature": 24.5
          }
        }
  - _id: fld_telemetry
    _type: request_group
    parentId: wrk_procel_current
    name: Telemetry
  - _id: req_raw_ingest
    _type: request
    parentId: fld_telemetry
    name: Ingestao REST bruta
    method: POST
    url: "{{ _.telemetryUrl }}/api/telemetry/events"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |
        {
          "source": "REST",
          "messageId": "{{ _.telemetryMessageId }}",
          "sensorId": "{{ _.sensorExternalId }}",
          "sourceTimestamp": "{{ _.fromIso }}",
          "payload": {
            "temperature": 24.5
          }
        }
  - _id: req_raw_list
    _type: request
    parentId: fld_telemetry
    name: Listar eventos brutos
    method: GET
    url: "{{ _.telemetryUrl }}/api/telemetry/events?page=0&size=20&sensorId={{ _.sensorExternalId }}"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
  - _id: req_raw_detail
    _type: request
    parentId: fld_telemetry
    name: Detalhar evento bruto
    method: GET
    url: "{{ _.telemetryUrl }}/api/telemetry/events/{{ _.rawTelemetryEventId }}"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
  - _id: req_raw_reprocess
    _type: request
    parentId: fld_telemetry
    name: Reprocessar evento bruto
    method: POST
    url: "{{ _.telemetryUrl }}/api/telemetry/events/{{ _.rawTelemetryEventId }}/reprocess"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |
        {
          "reason": "Reprocessamento manual de exemplo local"
        }
  - _id: fld_analytics
    _type: request_group
    parentId: wrk_procel_current
    name: Agregacoes
  - _id: req_create_job
    _type: request
    parentId: fld_analytics
    name: Criar job de agregacao
    method: POST
    url: "{{ _.baseUrl }}/api/analytics/aggregation-jobs"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"
    headers:
      - name: Content-Type
        value: application/json
    body:
      mimeType: application/json
      text: |
        {
          "from": "{{ _.fromIso }}",
          "to": "{{ _.toIso }}",
          "windowDuration": "PT15M",
          "sensorExternalId": "{{ _.sensorExternalId }}",
          "compartimentoId": "{{ _.roomId }}"
        }
  - _id: req_get_job
    _type: request
    parentId: fld_analytics
    name: Consultar job de agregacao
    method: GET
    url: "{{ _.baseUrl }}/api/analytics/aggregation-jobs/{{ _.aggregationJobId }}"
    authentication:
      type: bearer
      token: "{{ _.jwtToken }}"

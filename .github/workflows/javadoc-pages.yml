name: Publish JavaDoc

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Generate Proben-API JavaDoc
        run: sh Proben-API/mvnw -f Proben-API/pom.xml -B -ntp javadoc:javadoc

      - name: Generate Proben-Telemetry JavaDoc
        run: sh Proben-API/mvnw -f Proben-Telemetry/pom.xml -B -ntp javadoc:javadoc

      - name: Assemble documentation site
        shell: bash
        run: |
          mkdir -p site/api site/telemetry
          cp -R Proben-API/target/reports/apidocs/. site/api/
          cp -R Proben-Telemetry/target/reports/apidocs/. site/telemetry/
          cat > site/index.html <<'EOF'
          <!doctype html>
          <html lang="pt-BR">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>PROBEN JavaDoc</title>
            </head>
            <body>
              <main>
                <h1>PROBEN JavaDoc</h1>
                <ul>
                  <li><a href="api/">Proben-API</a></li>
                  <li><a href="telemetry/">Proben-Telemetry</a></li>
                </ul>
              </main>
            </body>
          </html>
          EOF

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
